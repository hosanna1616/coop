services:
  postgres:
    image: postgres:16-alpine
    container_name: merchant-nation-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: merchant
      POSTGRES_PASSWORD: merchant_secret
      POSTGRES_DB: merchant_nation
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
